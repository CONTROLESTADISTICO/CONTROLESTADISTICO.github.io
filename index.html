        /* ========================================================================

           ========================================================================

           - team1 = ID del primer equipo (debe coincidir con TEAMS)

            },

        /* ==========================================================================
           AUTOGENERACIÓN DE FECHAS Y HORAS VÁLIDAS
           ========================================================================== */
        function initializeJornadasSchedule() {
            const allowedHours = ["19:00", "20:00", "21:00"];
            let baseDate = new Date(2026, 10, 3); // 3 de nov 2026

            JORNADAS.forEach((jornada, jIdx) => {
                jornada.matches.forEach((match, mIdx) => {
                    if (!match.date || !match.time) {
                        while (true) {
                            const dayOfWeek = baseDate.getDay();
                            if (dayOfWeek === 2 || dayOfWeek === 4 || dayOfWeek === 5) {
                                break;
                            }
                            baseDate.setDate(baseDate.getDate() + 1);
                        }

                        const year = baseDate.getFullYear();
                        const month = String(baseDate.getMonth() + 1).padStart(2, '0');
                        const day = String(baseDate.getDate()).padStart(2, '0');

                        match.date = match.date || `${year}-${month}-${day}`;
                        match.time = match.time || allowedHours[(jIdx + mIdx) % allowedHours.length];
                        baseDate.setDate(baseDate.getDate() + 2);
                    }
                });
            });
        }

        function formatReadableDate(dateString) {
            if (!dateString) return "";
            try {
                const [year, month, day] = dateString.split('-').map(Number);
                const date = new Date(year, month - 1, day);
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                let formatted = date.toLocaleDateString('es-ES', options);
                return formatted.charAt(0).toUpperCase() + formatted.slice(1);
            } catch(e) {
                return dateString;
            }
        }

        function formatReadableTime(timeString) {
            if (!timeString) return "";
            try {
                const [hourStr, minStr] = timeString.split(':');
                let hour = parseInt(hourStr, 10);
                const ampm = hour >= 12 ? 'PM' : 'AM';
                hour = hour % 12;
                hour = hour ? hour : 12;
                return `${hour}:${minStr || '00'} ${ampm}`;
            } catch(e) {
                return timeString;
            }
        }

        /* ==========================================================================
           ESTADO GLOBAL DE LA APLICACIÓN
           ========================================================================== */
        let currentView = 'home';
        let selectedJornadaId = null;
        let selectedMatchData = null;
        
        let matchState = {
            active: false,
            finished: false,
            currentQuarter: 1,
            startTime: null,
            endTime: null,
            scores: { team1: 0, team2: 0 },
            quarters: {
                1: { team1: 0, team2: 0 },
                2: { team1: 0, team2: 0 },
                3: { team1: 0, team2: 0 },
                4: { team1: 0, team2: 0 }
            },
            teamStats: {}, 
            history: [] 
        };

        function initApp() {
            initializeJornadasSchedule();
            const savedMatch = localStorage.getItem('lnc_active_match');
            if (savedMatch) {
                try {
                    const parsed = JSON.parse(savedMatch);
                    if (parsed && parsed.matchData) {
                        selectedMatchData = parsed.matchData;
                        matchState = parsed.matchState;
                    }
                } catch(e) {
                    console.error("Error al cargar estado guardado", e);
                }
            }
            renderView();
        }

        function saveState() {
            if (selectedMatchData && matchState.active) {
                localStorage.setItem('lnc_active_match', JSON.stringify({
                    matchData: selectedMatchData,
                    matchState: matchState
                }));
            } else {
                localStorage.removeItem('lnc_active_match');
            }
        }

        function goToHome() {
            currentView = 'home';
            renderView();
        }

        function goToJornadas() {
            currentView = 'jornadas';
            renderView();
        }

        function renderView() {
            const container = document.getElementById('view-container');
            const headerActions = document.getElementById('header-actions');
            
            headerActions.innerHTML = '';

            if (currentView === 'home') {
                container.innerHTML = renderHomeView();
            } else if (currentView === 'jornadas') {
                headerActions.innerHTML = `
                    <button onclick="goToHome()" class="px-3 py-1.5 text-sm font-medium text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200 transition">
                        <i class="fa-solid fa-house mr-1"></i> Inicio
                    </button>
                `;
                container.innerHTML = renderJornadasView();
            } else if (currentView === 'match') {
                headerActions.innerHTML = `
                    <button onclick="confirmResetMatch()" class="px-3 py-1.5 text-xs font-semibold text-red-600 bg-red-50 border border-red-200 rounded-lg hover:bg-red-100 transition">
                        <i class="fa-solid fa-rotate-left mr-1"></i> Reiniciar
                    </button>
                    <button onclick="confirmExitMatch()" class="px-3 py-1.5 text-xs font-semibold text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200 transition">
                        <i class="fa-solid fa-house mr-1"></i> Salir
                    </button>
                `;
                container.innerHTML = renderMatchView();
            } else if (currentView === 'report') {
                headerActions.innerHTML = `
                    <button onclick="currentView='match'; renderView();" class="px-3 py-1.5 text-sm font-medium text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200 transition">
                        <i class="fa-solid fa-arrow-left mr-1"></i> Volver al Partido

            }

        function resumePendingMatch() {

        /* ==========================================================================
           2 & 3. SELECCIÓN DE JORNADA Y PARTIDO
           ========================================================================== */
        function renderJornadasView() {
            if (!selectedJornadaId) selectedJornadaId = 1;
            const jornada = JORNADAS.find(j => j.id === selectedJornadaId);

            let jornadasTabsHTML = '';
            for (let i = 1; i <= 10; i++) {
                const active = i === selectedJornadaId;
                jornadasTabsHTML += `
                    <button onclick="selectJornada(${i})" class="px-4 py-2.5 rounded-xl font-bold text-sm whitespace-nowrap transition ${active ? 'bg-basketball-500 text-white shadow-md shadow-orange-500/20' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}">
                        Jornada ${i}
                    </button>
                `;
            }

            let matchesHTML = '';
            jornada.matches.forEach((m) => {
                const t1 = TEAMS.find(t => t.id === m.team1);
                const t2 = TEAMS.find(t => t.id === m.team2);
                const readableDate = formatReadableDate(m.date);
                const readableTime = formatReadableTime(m.time);

                matchesHTML += `
                    <div class="bg-white border border-gray-200 rounded-2xl p-5 shadow-sm hover:shadow-md transition flex flex-col sm:flex-row items-center justify-between gap-4">
                        <div class="flex flex-col items-center sm:items-start flex-1 w-full text-center sm:text-left">

                                <span class="px-2 py-0.5 bg-gray-100 font-black text-xs text-gray-500 rounded">VS</span>
                                <span class="font-bold text-gray-900 text-base sm:text-lg">${t2.name}</span>
                            </div>
                            <div class="text-xs text-gray-500 font-medium flex items-center space-x-3 mt-1">
                                <span><i class="fa-solid fa-calendar-days mr-1 text-basketball-500"></i> ${readableDate}</span>
                                <span>•</span>
                                <span><i class="fa-solid fa-clock mr-1 text-basketball-500"></i> ${readableTime}</span>
                            </div>
                        </div>
                        <button onclick="promptStartMatch('${m.team1}', '${m.team2}', ${jornada.id}, '${m.date}', '${m.time}')" class="w-full sm:w-auto px-6 py-3 bg-gray-900 hover:bg-basketball-500 text-white font-bold text-sm rounded-xl transition flex items-center justify-center space-x-2 whitespace-nowrap">

                            <i class="fa-solid fa-chevron-right text-xs"></i>
                        </button>

            return `

                    <div class="mb-6 flex items-center justify-between">
                        <h2 class="text-2xl font-black text-gray-900">Seleccionar Jornada</h2>

                        </button>
                    </div>

                    <div class="flex space-x-2 overflow-x-auto no-scrollbar pb-3 mb-6">
                        ${jornadasTabsHTML}
                    </div>

                    <div class="mb-4">
                        <h3 class="text-lg font-bold text-gray-800">Partidos de la Jornada ${selectedJornadaId}</h3>
                    </div>

                    <div class="space-y-4">
                        ${matchesHTML}
                    </div>
                </div>
            `;
        }

        function selectJornada(id) {
            selectedJornadaId = id;
            renderView();

        function promptStartMatch(team1Id, team2Id, jornadaId, date, time) {
            const t1 = TEAMS.find(t => t.id === team1Id);

        /* ==========================================================================

           ========================================================================== */
        function promptAdminPasswordForStart(team1Id, team2Id, jornadaId, date, time) {
            showModal(`
                <div class="text-center">
                    <div class="w-14 h-14 bg-gray-100 text-gray-800 rounded-full flex items-center justify-center mx-auto mb-4 text-xl">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <h3 class="text-xl font-black text-gray-900 mb-1">Acceso de administrador</h3>
                    <p class="text-xs text-gray-500 mb-4">Ingresa la contraseña para iniciar el partido</p>
                    
                    <div class="mb-4">
                        <input type="password" id="admin-password-input" placeholder="Contraseña" class="w-full px-4 py-3 border border-gray-300 rounded-xl text-center text-lg font-mono tracking-widest focus:outline-none focus:ring-2 focus:ring-basketball-500">
                        <p id="admin-error-msg" class="text-xs text-red-500 mt-1 hidden font-semibold">Contraseña incorrecta.</p>
                    </div>

                    <div class="flex space-x-3">
                        <button onclick="promptStartMatch('${team1Id}', '${team2Id}', ${jornadaId}, '${date}', '${time}')" class="flex-1 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl transition">
                            CANCELAR
                        </button>
                        <button onclick="verifyPasswordAndStart('${team1Id}', '${team2Id}', ${jornadaId}, '${date}', '${time}')" class="flex-1 py-3 bg-basketball-500 hover:bg-basketball-600 text-white font-bold rounded-xl shadow-lg transition">
                            CONFIRMAR
                        </button>
                    </div>
                </div>
            `);
        }

        function verifyPasswordAndStart(team1Id, team2Id, jornadaId, date, time) {
            const inputVal = document.getElementById('admin-password-input').value;
            if (inputVal === ADMIN_PASSWORD) {
                startMatch(team1Id, team2Id, jornadaId, date, time);
            } else {
                const errorMsg = document.getElementById('admin-error-msg');

        function startMatch(team1Id, team2Id, jornadaId, date, time) {
            closeModal();

            const teamStats = {};
            [team1Id, team2Id].forEach(tId => {
                const team = TEAMS.find(t => t.id === tId);
                teamStats[tId] = {
                    players: {},
                    totalFouls: 0,
                    totalTechs: 0
                };
                team.players.forEach(p => {

                        ...p,
                        freeThrows: 0,
                        twoPointers: 0,
                        threePointers: 0,
                        points: 0,
                        personalFouls: 0,
                        technicalFouls: 0
                    };
                });
            });

            matchState = {
                active: true,
                finished: false,
                currentQuarter: 1,
                startTime: new Date().toISOString(),
                endTime: null,
                scores: { team1: 0, team2: 0 },
                quarters: { 1: { team1: 0, team2: 0 }, 2: { team1: 0, team2: 0 }, 3: { team1: 0, team2: 0 }, 4: { team1: 0, team2: 0 } },
                teamStats: teamStats,
                history: []
            };

            saveState();
            currentView = 'match';
            renderView();

        function selectPlayer(teamId, playerId) {
            selectedPlayerForAction = { teamId, playerId };
            renderView();
        }

        /* ==========================================================================
           REGISTRO Y GESTIÓN DE ACCIONES
           ========================================================================== */
        function registerAction(teamId, type) {
            const playerId = selectedPlayerForAction.playerId;
            if (!playerId || selectedPlayerForAction.teamId !== teamId) return;

            const player = matchState.teamStats[teamId].players[playerId];
            const quarter = matchState.currentQuarter;
            
            let points = 0;
            let description = "";

            if (type === 'FT') {
                points = 1;
                player.freeThrows += 1;
                player.points += 1;
                description = `Q${quarter} — #${player.number} ${player.firstName} ${player.lastName} — TIRO LIBRE (+1)`;
            } else if (type === '2PT') {
                points = 2;
                player.twoPointers += 1;
                player.points += 2;
                description = `Q${quarter} — #${player.number} ${player.firstName} ${player.lastName} — DOBLE (+2)`;
            } else if (type === '3PT') {
                points = 3;
                player.threePointers += 1;
                player.points += 3;
                description = `Q${quarter} — #${player.number} ${player.firstName} ${player.lastName} — TRIPLE (+3)`;
            } else if (type === 'FOUL') {
                player.personalFouls += 1;
                matchState.teamStats[teamId].totalFouls += 1;
                description = `Q${quarter} — #${player.number} ${player.firstName} ${player.lastName} — FALTA PERSONAL`;
            } else if (type === 'TECH') {
                player.technicalFouls += 1;
                matchState.teamStats[teamId].totalTechs += 1;
                description = `Q${quarter} — #${player.number} ${player.firstName} ${player.lastName} — FALTA TÉCNICA`;
            }

            if (points > 0) {
                if (teamId === selectedMatchData.team1Id) {
                    matchState.scores.team1 += points;
                    matchState.quarters[quarter].team1 += points;
                } else {
                    matchState.scores.team2 += points;
                    matchState.quarters[quarter].team2 += points;
                }
            }

            matchState.history.push({
                id: Date.now().toString(),
                quarter: `Q${quarter}`,
                teamId,
                playerId,
                type,
                points,
                description,
                timestamp: new Date().toISOString()
            });

            saveState();
            renderView();
        }

        function undoLastAction() {
            if (matchState.history.length === 0) return;
            const lastAction = matchState.history.pop();
            revertActionData(lastAction);
            saveState();
            renderView();
        }

        function removeActionByIndex(index) {
            const action = matchState.history[index];
            matchState.history.splice(index, 1);
            revertActionData(action);
            saveState();
            renderView();
        }

        function revertActionData(action) {
            const { teamId, playerId, type, points, quarter } = action;
            const qNum = parseInt(quarter.replace('Q', ''));
            const player = matchState.teamStats[teamId].players[playerId];

            if (player) {
                if (type === 'FT') {
                    player.freeThrows = Math.max(0, player.freeThrows - 1);
                    player.points = Math.max(0, player.points - 1);
                } else if (type === '2PT') {
                    player.twoPointers = Math.max(0, player.twoPointers - 1);
                    player.points = Math.max(0, player.points - 2);
                } else if (type === '3PT') {
                    player.threePointers = Math.max(0, player.threePointers - 1);
                    player.points = Math.max(0, player.points - 3);
                } else if (type === 'FOUL') {
                    player.personalFouls = Math.max(0, player.personalFouls - 1);
                    matchState.teamStats[teamId].totalFouls = Math.max(0, matchState.teamStats[teamId].totalFouls - 1);
                } else if (type === 'TECH') {
                    player.technicalFouls = Math.max(0, player.technicalFouls - 1);
                    matchState.teamStats[teamId].totalTechs = Math.max(0, matchState.teamStats[teamId].totalTechs - 1);
                }
            }

            if (points > 0) {
                if (teamId === selectedMatchData.team1Id) {
                    matchState.scores.team1 = Math.max(0, matchState.scores.team1 - points);
                    matchState.quarters[qNum].team1 = Math.max(0, matchState.quarters[qNum].team1 - points);
                } else {
                    matchState.scores.team2 = Math.max(0, matchState.scores.team2 - points);
                    matchState.quarters[qNum].team2 = Math.max(0, matchState.quarters[qNum].team2 - points);
                }
            }
        }

        function confirmNextQuarter() {
            if (matchState.currentQuarter >= 4) {

        /* Función Unificada para crear el PDF Blob con todos los datos reales */
        function createMatchPDFBlob() {
            if (!window.jspdf || !window.jspdf.jsPDF) {
                throw new Error("Librería jsPDF no disponible.");
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const t1 = TEAMS.find(t => t.id === selectedMatchData.team1Id);
            const t2 = TEAMS.find(t => t.id === selectedMatchData.team2Id);
            const s1 = matchState.scores.team1;
            const s2 = matchState.scores.team2;
            const readableDate = formatReadableDate(selectedMatchData.date);
            const readableTime = formatReadableTime(selectedMatchData.time);

            // Encabezado
            doc.setFont("helvetica", "bold");
            doc.setFontSize(18);
            doc.text("LIGA NORTE CAJEME", 105, 15, { align: "center" });
            
            doc.setFontSize(12);
            doc.setTextColor(249, 115, 22);
            doc.text("REPORTE OFICIAL DEL PARTIDO", 105, 22, { align: "center" });

            doc.setFontSize(10);
            doc.setTextColor(100, 100, 100);
            doc.text(`Jornada ${selectedMatchData.jornadaId} | Fecha: ${readableDate} | Hora: ${readableTime}`, 105, 28, { align: "center" });

            // Resultado final
            doc.setFontSize(14);
            doc.setTextColor(0, 0, 0);
            doc.text(`${t1.name}   ${s1} - ${s2}   ${t2.name}`, 105, 38, { align: "center" });

            let startY = 46;

            // Tabla por cuartos
            doc.setFontSize(11);
            doc.text("MARCADOR POR CUARTOS", 14, startY);

            const quartersData = [
                [t1.name, matchState.quarters[1].team1, matchState.quarters[2].team1, matchState.quarters[3].team1, matchState.quarters[4].team1, s1],
                [t2.name, matchState.quarters[1].team2, matchState.quarters[2].team2, matchState.quarters[3].team2, matchState.quarters[4].team2, s2]
            ];

            if (doc.autoTable) {
                doc.autoTable({
                    startY: startY + 4,
                    head: [['Equipo', 'Q1', 'Q2', 'Q3', 'Q4', 'TOTAL']],
                    body: quartersData,
                    theme: 'grid',
                    headStyles: { fillColor: [249, 115, 22] },
                    styles: { halign: 'center' }
                });
                startY = doc.lastAutoTable.finalY + 10;
            } else {
                startY += 25;
            }

            // Estadísticas equipo 1 con datos reales de matchState
            doc.text(`ESTADÍSTICAS INDIVIDUALES — ${t1.name}`, 14, startY);
            const stats1 = Object.values(matchState.teamStats[selectedMatchData.team1Id].players).map(p => [
                p.number, `${p.firstName} ${p.lastName}`, p.freeThrows, p.twoPointers, p.threePointers, p.points, p.personalFouls, p.technicalFouls
            ]);

            if (doc.autoTable) {
                doc.autoTable({
                    startY: startY + 4,
                    head: [['#', 'Jugador', '1 PT', 'Dobles', 'Triples', 'PTS', 'Faltas', 'Técnicas']],
                    body: stats1,
                    theme: 'grid',
                    headStyles: { fillColor: [40, 40, 40] }
                });
                startY = doc.lastAutoTable.finalY + 10;
            } else {
                startY += 30;
            }

            // Estadísticas equipo 2 con datos reales de matchState
            doc.text(`ESTADÍSTICAS INDIVIDUALES — ${t2.name}`, 14, startY);
            const stats2 = Object.values(matchState.teamStats[selectedMatchData.team2Id].players).map(p => [
                p.number, `${p.firstName} ${p.lastName}`, p.freeThrows, p.twoPointers, p.threePointers, p.points, p.personalFouls, p.technicalFouls
            ]);

            if (doc.autoTable) {
                doc.autoTable({
                    startY: startY + 4,
                    head: [['#', 'Jugador', '1 PT', 'Dobles', 'Triples', 'PTS', 'Faltas', 'Técnicas']],
                    body: stats2,
                    theme: 'grid',
                    headStyles: { fillColor: [40, 40, 40] }
                });
                startY = doc.lastAutoTable.finalY + 10;
            } else {
                startY += 30;
            }

            // Detalle de acciones
            doc.addPage();
            doc.text("DETALLE DE ACCIONES DEL PARTIDO", 14, 20);
            const historyData = matchState.history.map(act => [
                act.quarter, act.description, new Date(act.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            ]);

            if (doc.autoTable) {
                doc.autoTable({
                    startY: 25,
                    head: [['Cuarto', 'Acción Registrada', 'Hora']],
                    body: historyData.length > 0 ? historyData : [['-', 'Sin acciones registradas', '-']],
                    theme: 'grid',
                    headStyles: { fillColor: [249, 115, 22] }
                });
            }

            return doc;
        }

        let isGeneratingPdf = false;
        function generatePDF() {
            if (isGeneratingPdf) return;
            isGeneratingPdf = true;
            setTimeout(() => { isGeneratingPdf = false; }, 1500);

            try {
                const doc = createMatchPDFBlob();
                const t1 = TEAMS.find(t => t.id === selectedMatchData.team1Id);
                const t2 = TEAMS.find(t => t.id === selectedMatchData.team2Id);
                const cleanName1 = t1.shortName.replace(/[^a-zA-Z0-9]/g, '_');
                const cleanName2 = t2.shortName.replace(/[^a-zA-Z0-9]/g, '_');
                doc.save(`Reporte_Jornada_${selectedMatchData.jornadaId}_${cleanName1}_vs_${cleanName2}.pdf`);
            } catch (error) {
                console.error("Error al generar PDF:", error);
                alert("Ocurrió un error al generar el archivo PDF. Revisa tu conexión a Internet.");
            }
        }

        /* Envío de correo usando FormSubmit y la misma función createMatchPDFBlob */
        async function sendEmailReport() {
            const t1 = TEAMS.find(t => t.id === selectedMatchData.team1Id);
            const t2 = TEAMS.find(t => t.id === selectedMatchData.team2Id);
            const s1 = matchState.scores.team1;
            const s2 = matchState.scores.team2;

            showModal(`
                <div class="text-center py-4">
                    <div class="w-12 h-12 border-4 border-basketball-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                    <h3 class="text-lg font-bold text-gray-900 mb-1" id="modal-status-title">Generando PDF...</h3>
                    <p class="text-xs text-gray-500" id="modal-status-desc">Preparando archivo unificado para envío seguro.</p>
                </div>
            `);

            try {
                const doc = createMatchPDFBlob();
                const pdfBlob = doc.output('blob');
                const cleanName1 = t1.shortName.replace(/[^a-zA-Z0-9]/g, '_');
                const cleanName2 = t2.shortName.replace(/[^a-zA-Z0-9]/g, '_');
                const pdfFileName = `Reporte_Jornada_${selectedMatchData.jornadaId}_${cleanName1}_vs_${cleanName2}.pdf`;

                document.getElementById('modal-status-title').innerText = "Enviando reporte...";
                document.getElementById('modal-status-desc').innerText = "Transmitiendo datos a Musica00p55@gmail.com";

                const formData = new FormData();
                formData.append('_subject', `Reporte Partido — Liga Norte Cajeme — Jornada ${selectedMatchData.jornadaId}`);
                formData.append('message', `Reporte oficial del partido:\n\n${t1.name} ${s1} - ${s2} ${t2.name}\nJornada: ${selectedMatchData.jornadaId}\nFecha: ${formatReadableDate(selectedMatchData.date)}\nHora: ${formatReadableTime(selectedMatchData.time)}`);
                formData.append('_template', 'box');
                formData.append('_captcha', 'false');
                formData.append('attachment', pdfBlob, pdfFileName);

                const response = await fetch("https://formsubmit.co/ajax/Musica00p55@gmail.com", {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    showModal(`
                        <div class="text-center py-4">
                            <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                                <i class="fa-solid fa-check"></i>
                            </div>
                            <h3 class="text-xl font-black text-gray-900 mb-2">¡Solicitud de Envío Exitosa!</h3>
                            <p class="text-sm text-gray-600 mb-4">El servidor ha procesado el envío del reporte oficial a <strong>Musica00p55@gmail.com</strong>.</p>
                            <p class="text-xs text-gray-500 mb-6 bg-orange-50 p-3 rounded-xl border border-orange-200">
                                ⚠️ <strong>Nota importante:</strong> Si es la primera vez que se utiliza este servicio con este correo, FormSubmit requiere que revises tu bandeja de entrada o correo no deseado (spam) para activar y confirmar el servicio.
                            </p>
                            <button onclick="closeModal()" class="w-full py-3 bg-gray-900 text-white font-bold rounded-xl">Aceptar</button>
                        </div>
                    `);
                } else {
                    throw new Error("Respuesta no exitosa de FormSubmit");
                }

            } catch (error) {
                console.warn("FormSubmit AJAX limitación o error de red, ejecutando respaldo de descarga local:", error);
                generatePDF();
                showModal(`
                    <div class="text-center py-4">
                        <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                        </div>
                        <h3 class="text-xl font-black text-gray-900 mb-2">Aviso de Envío</h3>
                        <p class="text-sm text-gray-600 mb-6">No se pudo enviar automáticamente por restricciones de red o confirmación pendiente. El PDF se ha descargado localmente en tu dispositivo como respaldo.</p>
                        <button onclick="closeModal()" class="w-full py-3 bg-basketball-500 text-white font-bold rounded-xl">Entendido</button>
                    </div>
                `);
            }
        }

        /* ==========================================================================
           UTILIDADES DE MODAL
           ========================================================================== */
        function showModal(htmlContent, wide = false) {
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            content.className = `bg-white rounded-2xl ${wide ? 'max-w-2xl' : 'max-w-md'} w-full p-6 shadow-2xl transform transition-all`;
            content.innerHTML = htmlContent;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('modal-container');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        // Inicializar al cargar
        window.onload = initApp;
    </script>
